name: clang-tidy-review

on: [pull_request]

jobs:
  review:
    runs-on: ubuntu-20.04
    container:
      image: ubuntu:latest
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup
    env:
      PETSC_DIR: /usr/lib/petscdir/3.7.7/x86_64-linux-gnu-real
      PETSC_ARCH: ""
      SLEPC_DIR: /usr/lib/slepcdir/3.7.4/x86_64-linux-gnu-real
      SLEPC_ARCH: ""
    steps:
      - name: Install dependencies
        run: apt update &&
             DEBIAN_FRONTEND=noninteractive
             apt-get install -y --no-install-recommends
                 build-essential cmake git
                 libfftw3-dev
                 libnetcdf-dev
                 libnetcdf-c++4-dev
                 netcdf-bin
                 openmpi-bin
                 libopenmpi-dev
                 petsc-dev
                 slepc-dev
                 liblapack-dev
                 libparpack2-dev
                 libsundials-dev
                 ca-certificates

      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: Create compile_commands.json
        run: |
          cmake --version
          cmake . -B build -DBUILD_SHARED_LIBS=ON \
                           -DBOUT_USE_PETSC=ON \
                           -DBOUT_USE_SLEPC=ON \
                           -DBOUT_USE_SUNDIALS=ON \
                           -DBOUT_BUILD_EXAMPLES=ON \
                           -DBOUT_BUILD_DOCS=OFF \
                           -DBOUT_ENABLE_PYTHON=OFF \
                           -DCMAKE_EXPORT_COMPILE_COMMANDS=On

      - name: Set CWD
        run: |
          env | grep PWD
          echo "cwd=$(pwd)" >> $GITHUB_ENV

      - name: Run clang-tidy
        uses: ZedThree/clang-tidy-review@fix-absolute-paths
        id: review
        with:
          build_dir: build
          apt_packages: "libfftw3-dev,libnetcdf-c++4-dev,libopenmpi-dev,petsc-dev,slepc-dev,liblapack-dev,libparpack2-dev,libsundials-dev,uuid-dev"
          config_file: ".clang-tidy"
          # Googletest triggers a _lot_ of clang-tidy warnings, so ignore all
          # the unit tests until they're fixed or ignored upstream
          exclude: "tests/unit/*cxx"
          base_dir: ${{ env.cwd }}
